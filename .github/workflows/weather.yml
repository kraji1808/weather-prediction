name: Daily Weather Automation

on:
  # Triggers automatically when code is pushed to Git
  push:
    branches: [ main, master ]

  # Triggers on Pull Requests
  pull_request:
    branches: [ main, master ]

  # Triggers automatically every morning at 8:00 AM IST (02:30 UTC)
  schedule:
    - cron: '30 2 * * *'

  # Allows manual run anytime with a button in GitHub Actions tab
  workflow_dispatch:

jobs:
  weather-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weather Email Automation
        env:
          GMAIL_USERNAME: "thahrinah05@gmail.com"
          GMAIL_APP_PASSWORD: "cwjp dkou chbq vlqj"
          EMAIL_TO: "kannanraji1808@gmail.com"
          DEFAULT_CITY: "Chennai, India"
          WEATHER_API_KEY: "YOUR_WEATHER_API_KEY"
        run: |
          python weather.py --now
